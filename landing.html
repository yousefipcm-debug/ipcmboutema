<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPCM Boutema</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      font-family: "Segoe UI", sans-serif;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 420px;
      width: 100%%;
      text-align: center;
      box-shadow: 0 12px 48px rgba(0,0,0,0.12);
    }

    .logo-wrap { margin-bottom: 10px; }
    .logo-wrap img { height: 64px; width: auto; }

    .tagline { color: #999; font-size: 13px; letter-spacing: 0.5px; margin-bottom: 8px; }

    .divider {
      width: 48px; height: 3px;
      background: #b85a1a;
      border-radius: 2px;
      margin: 16px auto 36px;
    }

    .label {
      color: #888; font-size: 13px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;
    }

    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; width: 100%%; padding: 17px 24px;
      border-radius: 14px; font-size: 16px; font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      margin-bottom: 14px;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); filter: brightness(1.05); }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .btn-website  { background: #595959; color: #fff; }
    .btn-facebook { background: #b85a1a; color: #fff; }

    .footer { margin-top: 32px; color: #ccc; font-size: 12px; }
  </style>
</head>
